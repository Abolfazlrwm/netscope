name: release

# On a version tag: build the sdist + wheel and attach them to the
# GitHub release, so every release is pip-installable without cloning.
# The release page itself is authored by hand; this job only adds the
# dist artifacts (and would create a stub release if one is missing).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dist:
    name: Build and attach dist artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
