[project]
name = "netscope"
version = "0.13.0"
description = "Internet Experience Intelligence & Network Diagnostics Platform — from raw measurements to 'what's wrong, and where', with evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "NetScope Contributors" }]
keywords = ["network", "diagnostics", "traceroute", "ping", "isp", "monitoring", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "icmplib>=3.0.4",   # LGPL-3.0 - ICMP ping (dynamic import, not modified)
    "dnspython>=2.8.0", # ISC License - DNS resolution
    "httpx>=0.28.1",    # BSD-3-Clause - HTTP probing
    "psutil>=6.0.0",    # BSD-3-Clause - system/network interface info
    "rich>=13.0.0",     # MIT - terminal rendering (tables, panels, colors)
]

[project.optional-dependencies]
tui = [
    "textual>=1.0.0",   # MIT - terminal UI dashboard
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "textual>=1.0.0",   # for TUI smoke tests
]

[project.urls]
Homepage = "https://github.com/Abolfazlrwm/netscope"
Documentation = "https://github.com/Abolfazlrwm/netscope/tree/main/docs"
Issues = "https://github.com/Abolfazlrwm/netscope/issues"
Changelog = "https://github.com/Abolfazlrwm/netscope/blob/main/CHANGELOG.md"

[project.scripts]
netscope = "netscope.ui.cli:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netscope = ["py.typed"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:textual.*",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 150
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "SIM105", # contextlib.suppress suggestion — explicit try/except is clearer in probe error paths
    "SIM102", # nested-if collapsing — the diagnosis engine's guard chains read better expanded
    "SIM115", # open-without-context — lookup adapters open their database once in __init__ by design
    "UP042",  # (str, Enum) -> StrEnum — changes str(member) semantics across models; not worth the churn
    "E501",   # long docstring lines are the codebase's documented-why style; ruff format still applies
    "C408",   # dict(**overrides) merge idioms in test builders are clearer than literal+update
    "SIM108", # the scoring engine's if/else branch carries its own explanation comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B023"]  # B023: per-iteration monkeypatch lambdas are called within their own loop pass

# ---------------------------------------------------------------------------
# Mypy — best-effort strictness on the domain core
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["netscope"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/netscope"]
omit = ["src/netscope/ui/tui/*"]
