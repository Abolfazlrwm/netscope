[project]
name = "netscope"
version = "0.1.0"
description = "Internet Experience Intelligence & Network Diagnostics Platform — from raw measurements to 'what's wrong, and where', with evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NetScope Contributors" }]
keywords = ["network", "diagnostics", "traceroute", "ping", "isp", "monitoring", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "icmplib>=3.0.4",   # LGPL-3.0 - ICMP ping (dynamic import, not modified)
    "dnspython>=2.8.0", # ISC License - DNS resolution
    "httpx>=0.28.1",    # BSD-3-Clause - HTTP probing
    "psutil>=6.0.0",    # BSD-3-Clause - system/network interface info
    "rich>=13.0.0",     # MIT - terminal rendering (tables, panels, colors)
]

[project.optional-dependencies]
tui = [
    "textual>=1.0.0",   # MIT - terminal UI dashboard
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "textual>=1.0.0",   # for TUI smoke tests
]

[project.urls]
Homepage = "https://github.com/USERNAME/netscope"
Documentation = "https://github.com/USERNAME/netscope/tree/main/docs"
Issues = "https://github.com/USERNAME/netscope/issues"
Changelog = "https://github.com/USERNAME/netscope/blob/main/CHANGELOG.md"

[project.scripts]
netscope = "netscope.ui.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netscope = ["py.typed"]

